name: ci

# Runs only when something that can actually break CI changed: a docs-only
# commit skips the workflow entirely, and a plugin-only commit runs just the
# plugin job (both gates come from the `changes` job below). Every job costs
# minutes on a free plan, so a commit pays only for the gates its own paths can
# break.
#
# Docs are deliberately not a trigger: prose changes cannot break the Android
# build or the hook guard, and the guard's own retired-term scan over `*.md`
# runs in the pre-commit hook on every commit — more reliably than a post-push
# job.
#
# Note: with `paths` filtering plus gated jobs, a skipped job reports "skipped"
# rather than "success". If branch protection ever requires these check names
# on pull requests, either keep the workflow unfiltered or mirror the gates as
# step-level `if:` conditions instead.
on:
  push:
    branches: [main]
    paths: &ci_paths
      - "apps/android/**"
      - "fixtures/**"
      - "scripts/**"
      - "contracts/**"
      - ".amp/plugins/**"
      - ".github/workflows/**"
  pull_request:
    types: [opened, ready_for_review, synchronize]
    paths: *ci_paths
  workflow_dispatch:

# A newer commit on the same ref makes the older run pointless, so a push cancels the run it
# supersedes. What cancellation must not do is drop a gate: each push is classified over its own
# commit range (`github.event.before..HEAD`), so the surviving run covers everything that range
# touches. The case that used to break this was a docs-only commit landing right after a code
# commit: it cancelled the only run that would have exercised `apps/android/**` and then skipped
# that job (it happened four times in one day). Docs commits now trigger nothing at all, so they
# cannot cancel a run either. The residual case is a push of one area (say `scripts/**`) landing
# inside the few minutes an app push's run lasts: that push's run does not cover
# `apps/android/**`, and the app commit gets its Android gate from the next app push plus the
# local gate before it. An expression like `${{ github.event_name != 'push' }}` for
# `cancel-in-progress` would not help here: the interpolated `false` is a non-empty string and
# the runner reads it as true.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      plugin: ${{ steps.filter.outputs.plugin }}
      plugin_enabled: ${{ steps.filter.outputs.plugin_enabled }}
      nativedo: ${{ steps.filter.outputs.nativedo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # `main` disabled the plugin by renaming its entry point to
          # `index.ts.bak`; keep the gate for when it is re-enabled, but do not
          # fail on tests that import a file that is deliberately absent.
          if [ -f .amp/plugins/jev-router/index.ts ]; then
            echo "plugin_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "plugin_enabled=false" >> "$GITHUB_OUTPUT"
          fi
          base="${BASE:-}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            # Unknown base (first push, force push, manual run): check everything.
            echo "plugin=true" >> "$GITHUB_OUTPUT"
            echo "nativedo=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both events classify the same way: over the files this push (or this pull request)
          # actually changed. A push's range is its own commits, so the run that survives
          # cancellation still covers everything the surviving push touches.
          plugin=false
          nativedo=false
          while IFS= read -r path; do
            case "$path" in
              # The full-Telegram subtree and our module.
              apps/android/telegram/*|apps/android/nativedo/*) nativedo=true ;;
              # `DiscourseApiClientTest` / `DiscourseMediaUploaderTest` read fixtures/discourse/*,
              # so a fixture edit can fail the unit suite even though it ships no code.
              fixtures/*) nativedo=true ;;
              # The telegram deps/hook-guard tools and their tests both live in `scripts/`.
              scripts/telegram_*|scripts/telegram-*|scripts/telegramlib.py|scripts/tests/test_telegram_*) nativedo=true ;;
              scripts/*|contracts/*) nativedo=true ;;
              .amp/plugins/*) plugin=true ;;
              .github/workflows/*) plugin=true; nativedo=true ;;
            esac
          done < <(git diff --name-only "$base" HEAD)
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "nativedo=$nativedo" >> "$GITHUB_OUTPUT"

  plugin:
    needs: changes
    if: needs.changes.outputs.plugin == 'true' && needs.changes.outputs.plugin_enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .amp/plugins
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pin the runtime the lockfile was written with; the typecheck gate is
          # only meaningful if the toolchain does not move under it.
          bun-version: "1.3.10"

      - name: Install plugin dev tooling
        # Dev-only: the plugin itself has no runtime dependencies. The lockfile is
        # committed, so this is reproducible and `--frozen-lockfile` fails if a
        # dependency was changed without updating it.
        run: bun install --frozen-lockfile

      - name: Plugin unit tests
        run: bun test jev-router/tests/

      - name: Plugin typecheck
        run: bun run typecheck

  # The full-Telegram stack: `apps/android/telegram` (a git subtree of upstream
  # kept byte-for-byte) plus our module at `apps/android/nativedo`. This job needs
  # a different toolchain (platform/build-tools 36, NDK 27.2.12479018, CMake
  # 3.22.1), a full-history clone (the subtree pin and its dependency gitlinks
  # live in history), and a source fetch of those pinned dependency trees before
  # Gradle can run.
  #
  # Compile the test classes once and publish the Gradle build cache, so the
  # shards below do not each pay the ~8-10 minute :TMessagesProj Java compile.
  nativedo-build:
    needs: changes
    if: needs.changes.outputs.nativedo == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The pin is the `git subtree` merge of apps/android/telegram; its tree
          # carries the 15 dependency gitlinks. A shallow clone cannot resolve
          # either, so both `scripts/telegram-deps.sh` and the hook guard would
          # have nothing to read.
          fetch-depth: 0
      - name: Free disk space
        # The private-repository runner has a 14 GB SSD and preinstalls several
        # SDKs we do not use. The Android build plus Gradle caches otherwise
        # fill it; the pinned NDK is installed again by setup-android below.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1 platform-tools"

      # Same retry-and-cache reasoning as before: artifact resolution fails
      # transiently, and a warm Gradle home turns a re-attempt into local reads.
      # The key lists the build scripts explicitly instead of a broad
      # `**/*.gradle*` glob, which would also match the `.gradle` project
      # directory and could never hit.
      - uses: actions/cache/restore@v4
        id: nativedo-gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-nativedo-v2-${{ runner.os }}-${{ hashFiles('apps/android/telegram/build.gradle', 'apps/android/telegram/settings.gradle', 'apps/android/telegram/gradle.properties', 'apps/android/telegram/gradle/**', 'apps/android/telegram/buildSrc/**/*.gradle*', 'apps/android/telegram/TMessagesProj/build.gradle', 'apps/android/nativedo/build.gradle') }}
          restore-keys: |
            gradle-nativedo-v2-${{ runner.os }}-

      - name: Materialize pinned Telegram dependency trees
        # Idempotent and pinned to the subtree's gitlinks: fetches each of the 15
        # trees from its own `.gitmodules` remote and extracts it. No prebuilt
        # `.so` is copied from anywhere.
        run: scripts/telegram-deps.sh

      - name: Hook guard (upstream stays pristine)
        # Fails on any non-hook edit under apps/android/telegram, so a render,
        # measurement or gesture change shows up here instead of silently
        # entering the subtree.
        run: scripts/telegram-hook-guard.sh

      - name: Dependency and hook-guard tool tests
        run: python3 -m unittest discover -s scripts/tests -t scripts/tests -p 'test_telegram_*.py'

      - name: Bound build memory
        # Override upstream's 8 GB daemon without editing the subtree. The
        # build cache lets the test shards reuse this job's compiled classes.
        run: |
          free -m
          nproc
          df -h /
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          org.gradle.caching=true
          EOF

      - name: Compile test classes
        run: |
          ./apps/android/telegram/gradlew -p apps/android/telegram \
            :TMessagesProj:compileDebugJavaWithJavac \
            :nativedo:compileDailyDebugUnitTestKotlin \
            :nativedo:compileDailyDebugUnitTestJavaWithJavac \
            :nativedo:processDailyDebugUnitTestJavaRes \
            --console=plain

      # Saved only on success: a failed run leaves Gradle's cache with the
      # missing-artifact markers of whatever it could not download, and restoring
      # that made the next attempt fail on the same coordinate instead of a fresh
      # one. Only when the exact key missed; a restore-keys hit reports
      # `cache-hit: false` and does get saved, which keeps the entry current.
      - uses: actions/cache/save@v4
        if: success() && steps.nativedo-gradle-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-nativedo-v2-${{ runner.os }}-${{ hashFiles('apps/android/telegram/build.gradle', 'apps/android/telegram/settings.gradle', 'apps/android/telegram/gradle.properties', 'apps/android/telegram/gradle/**', 'apps/android/telegram/buildSrc/**/*.gradle*', 'apps/android/telegram/TMessagesProj/build.gradle', 'apps/android/nativedo/build.gradle') }}

  # The suite is 108 Robolectric classes, each in a fresh JVM. On the
  # private-repository 2-core runner a single job is killed before it finishes,
  # so split the classes into two parallel shards that restore the build cache
  # published by `nativedo-build` instead of compiling again.
  nativedo:
    needs: [changes, nativedo-build]
    if: needs.changes.outputs.nativedo == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - uses: actions/cache/restore@v4
        id: nativedo-gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-nativedo-v2-${{ runner.os }}-${{ hashFiles('apps/android/telegram/build.gradle', 'apps/android/telegram/settings.gradle', 'apps/android/telegram/gradle.properties', 'apps/android/telegram/gradle/**', 'apps/android/telegram/buildSrc/**/*.gradle*', 'apps/android/telegram/TMessagesProj/build.gradle', 'apps/android/nativedo/build.gradle') }}
          restore-keys: |
            gradle-nativedo-v2-${{ runner.os }}-

      - name: Materialize pinned Telegram dependency trees
        run: scripts/telegram-deps.sh

      - name: Bound build memory
        run: |
          free -m
          nproc
          df -h /
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          org.gradle.caching=true
          EOF

      - name: Select test shard
        id: shard
        run: |
          mapfile -t classes < <(
            find apps/android/nativedo/src/test/java -name '*Test.kt' \
              | sed 's|apps/android/nativedo/src/test/java/||; s|/|.|g; s|\.kt$||' \
              | sort
          )
          args=()
          for i in "${!classes[@]}"; do
            if (( i % 2 == ${{ matrix.shard }} )); then
              args+=(--tests "${classes[$i]}")
            fi
          done
          echo "shard ${{ matrix.shard }}: ${#args[@]} of ${#classes[@]} test classes"
          printf 'args=%s\n' "${args[*]}" >> "$GITHUB_OUTPUT"

      - name: Unit tests (shard ${{ matrix.shard }})
        # The plugin portal occasionally fails to resolve a buildSrc dependency;
        # retry once so a transient miss does not fail the shard. A runner
        # shutdown or a test failure is not retried into a false green.
        run: |
          # Keep every failed attempt's evidence, not only the last one: a native
          # abort often kills only the first attempt, and the retry then passes.
          # `test-results` carries the JVM's `-XX:ErrorFile` hs_err log and
          # Gradle's binary test output (the test JVM's stderr, where Robolectric's
          # native logcat lines land).
          evidence_root=apps/android/nativedo/build/ci-evidence
          for attempt in 1 2; do
            ./apps/android/telegram/gradlew -p apps/android/telegram \
              :nativedo:testDailyDebugUnitTest \
              -Pnativedo.test.maxHeapSize=3g \
              ${{ steps.shard.outputs.args }} --console=plain && exit 0
            status=$?
            echo "attempt $attempt failed (exit $status)"
            evidence="$evidence_root/attempt-$attempt"
            mkdir -p "$evidence"
            cp -a apps/android/nativedo/build/test-results "$evidence/" 2>/dev/null || true
            cp -a apps/android/nativedo/build/reports/tests "$evidence/reports-tests" 2>/dev/null || true
            cp -a apps/android/nativedo/build/outputs/logs "$evidence/outputs-logs" 2>/dev/null || true
            if [ "$attempt" = 2 ]; then exit $status; fi
            sleep 15
          done

      # A failed attempt is worth an artifact even when the retry turns the job
      # green: that is exactly how the 13.2.1 native abort hid for several runs.
      # `if-no-files-found: ignore` keeps a clean run artifact-free.
      - name: Upload failed-attempt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nativedo-attempt-evidence-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 7
          path: apps/android/nativedo/build/ci-evidence/**

      # On failure keep what a human needs to diagnose it without re-running the
      # job: the JUnit XML, the test report, and Gradle logs. Retained for a
      # week; a green run uploads nothing.
      - name: Upload verification artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nativedo-verification-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/android/nativedo/build/test-results/**
            apps/android/nativedo/build/reports/tests/**
            apps/android/nativedo/build/outputs/logs/**

  # The installable deliverable. It runs after `nativedo` so the APK only exists
  # for a commit whose unit tests and hook guard passed, and so this job restores
  # the Gradle dependency cache that `nativedo-build` saved instead of racing it.
  nativedo-apk:
    needs: [changes, nativedo-build]
    if: needs.changes.outputs.nativedo == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Free disk space
        # The private-repository runner has a 14 GB SSD and preinstalls several
        # SDKs we do not use. The Android build plus Gradle caches otherwise
        # fill it; the pinned NDK is installed again by setup-android below.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1 platform-tools"

      - uses: actions/cache/restore@v4
        id: nativedo-gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-nativedo-v2-${{ runner.os }}-${{ hashFiles('apps/android/telegram/build.gradle', 'apps/android/telegram/settings.gradle', 'apps/android/telegram/gradle.properties', 'apps/android/telegram/gradle/**', 'apps/android/telegram/buildSrc/**/*.gradle*', 'apps/android/telegram/TMessagesProj/build.gradle', 'apps/android/nativedo/build.gradle') }}
          restore-keys: |
            gradle-nativedo-v2-${{ runner.os }}-

      # CMake/NDK output is the slow part of this job. Its inputs are the pinned
      # subtree (all native sources) plus the CMake/AGP configuration, so the key
      # is the `git-subtree-split` SHA and a hash of those config files. No `.so`
      # is committed or shared through this cache.
      - name: Resolve subtree pin
        id: pin
        run: |
          pin="$(PYTHONPATH=scripts python3 -c 'from pathlib import Path; from telegramlib import subtree_pin; print(subtree_pin(Path(".")))')"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
          echo "subtree pin: $pin"

      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            apps/android/telegram/TMessagesProj/.cxx
            apps/android/telegram/TMessagesProj/build/intermediates/cxx
          key: nativedo-native-v1-${{ runner.os }}-${{ steps.pin.outputs.pin }}-${{ hashFiles('apps/android/telegram/TMessagesProj/jni/CMakeLists.txt', 'apps/android/telegram/TMessagesProj/jni/**/CMakeLists.txt', 'apps/android/telegram/TMessagesProj/jni/Application.mk', 'apps/android/telegram/TMessagesProj/build.gradle', 'apps/android/telegram/build.gradle', 'apps/android/telegram/gradle.properties', 'apps/android/telegram/buildSrc/**/*.gradle*', 'apps/android/nativedo/build.gradle') }}
          restore-keys: |
            nativedo-native-v1-${{ runner.os }}-${{ steps.pin.outputs.pin }}-

      - name: Materialize pinned Telegram dependency trees
        run: scripts/telegram-deps.sh

      - name: Bound build memory
        # Native compilation is the long pole here; keep the Gradle daemon small
        # enough for a ~7 GB private-repository runner and let clang use the rest.
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          EOF

      - name: Shared signing key (optional)
        # The key the Mac and orb builds use, when this repository holds it as secrets. With it the
        # APK can replace an install made on another machine; without it the assemble below still
        # runs and produces an installable APK signed with Gradle's per-machine debug key (which
        # cannot update another machine's install).
        # Secrets: NATIVEDO_KEYSTORE_B64 (base64 of the .jks file), NATIVEDO_KEYSTORE_PASSWORD,
        # NATIVEDO_KEY_ALIAS, NATIVEDO_KEY_PASSWORD. The materialized files are gitignored and
        # never land in the uploaded artifact (it contains only `build/outputs/apk/**/*.apk`).
        env:
          KEYSTORE_B64: ${{ secrets.NATIVEDO_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.NATIVEDO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NATIVEDO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NATIVEDO_KEY_PASSWORD }}
        run: |
          umask 077
          if [ -z "$KEYSTORE_B64" ]; then
            echo "no NATIVEDO_KEYSTORE_B64 secret: the arm64 APK uses the per-machine debug key"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > apps/android/nativedo/signing.jks
          {
            echo "storeFile=signing.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } > apps/android/nativedo/keystore.properties

      - name: arm64 assemble
        # An injected ABI otherwise makes AGP mark the APK as test-only (install
        # error -15); `testOnly=false` keeps it installable from the phone's
        # package installer.
        run: ./apps/android/telegram/gradlew -p apps/android/telegram :nativedo:assembleDailyDebug -Pandroid.injected.build.abi=arm64-v8a -Pandroid.injected.testOnly=false --quiet

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: nativedo-dailyDebug-arm64
          if-no-files-found: error
          retention-days: 14
          # An injected ABI makes AGP write the APK under build/intermediates/apk;
          # a normal variant writes it under build/outputs/apk.
          path: |
            apps/android/nativedo/build/intermediates/apk/daily/debug/*.apk
            apps/android/nativedo/build/outputs/apk/daily/debug/*.apk

      - uses: actions/cache/save@v4
        if: success() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            apps/android/telegram/TMessagesProj/.cxx
            apps/android/telegram/TMessagesProj/build/intermediates/cxx
          key: nativedo-native-v1-${{ runner.os }}-${{ steps.pin.outputs.pin }}-${{ hashFiles('apps/android/telegram/TMessagesProj/jni/CMakeLists.txt', 'apps/android/telegram/TMessagesProj/jni/**/CMakeLists.txt', 'apps/android/telegram/TMessagesProj/jni/Application.mk', 'apps/android/telegram/TMessagesProj/build.gradle', 'apps/android/telegram/build.gradle', 'apps/android/telegram/gradle.properties', 'apps/android/telegram/buildSrc/**/*.gradle*', 'apps/android/nativedo/build.gradle') }}
