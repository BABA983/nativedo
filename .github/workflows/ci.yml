name: ci

# Runs only when something that can actually break CI changed: a docs-only
# commit skips the workflow entirely, a vendor-tooling commit skips the Android
# job, and a plugin-only commit runs just the plugin job (both gates come from
# the `changes` job below). Every job costs minutes on a free plan, so a commit
# pays only for the gates its own paths can break.
#
# Docs are deliberately not a trigger. The one gate a prose change can trip is
# the guard's retired-term scan over `*.md` and `docs/**/*.md`, and that runs in
# the pre-commit hook (`vendor-guard.sh --quick` scans the same files) on every
# commit — more reliably than a post-push job, which would cost ~11 minutes of
# Actions quota for the same text scan.
#
# The macOS snapshot set is not a trigger either: this runner is Linux and only
# ever compares `src/test/snapshots/linux`, so a push that touches nothing but
# `snapshots/macos` has no gate here — the machine that recorded it verifies it.
# A push that carries macOS goldens *and* code still runs the code's gates.
#
# Note: with `paths` filtering plus gated jobs, a skipped job reports "skipped"
# rather than "success". If branch protection ever requires these check names
# on pull requests, either keep the workflow unfiltered or mirror the gates as
# step-level `if:` conditions instead.
on:
  push:
    branches: [main]
    paths: &ci_paths
      - "apps/android/**"
      - "!apps/android/app/src/test/snapshots/macos/**"
      - "fixtures/**"
      - "scripts/**"
      - "contracts/**"
      - "vendor-overlay.json"
      - "VENDOR.md"
      - ".amp/plugins/**"
      - ".github/workflows/**"
  pull_request:
    types: [opened, ready_for_review, synchronize]
    paths: *ci_paths
  workflow_dispatch:

# A newer commit on the same ref makes the older run pointless, so a push cancels the run it
# supersedes. What cancellation must not do is drop a gate: each push is classified over its own
# commit range (`github.event.before..HEAD`), so the surviving run covers everything that range
# touches. The case that used to break this was a docs-only commit landing right after a code
# commit: it cancelled the only run that would have exercised `apps/android/**` and then skipped
# that job (it happened four times in one day). Docs commits now trigger nothing at all - their one
# gate runs in the pre-commit hook - so they cannot cancel a run either. The residual case is a
# push of one area (say `scripts/**`) landing inside the few minutes an app push's run lasts: that
# push's run does not cover `apps/android/**`, and the app commit gets its Android gate from the
# next app push plus the local gate before it. An expression like `${{ github.event_name != 'push' }}`
# for `cancel-in-progress` would not help here: the interpolated `false` is a non-empty string and
# the runner reads it as true.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      vendor: ${{ steps.filter.outputs.vendor }}
      plugin: ${{ steps.filter.outputs.plugin }}
      nativedo: ${{ steps.filter.outputs.nativedo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE:-}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            # Unknown base (first push, force push, manual run): check everything.
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "vendor=true" >> "$GITHUB_OUTPUT"
            echo "plugin=true" >> "$GITHUB_OUTPUT"
            echo "nativedo=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both events classify the same way: over the files this push (or this pull request)
          # actually changed. A push's range is its own commits, so the run that survives
          # cancellation still covers everything the surviving push touches.
          android=false
          vendor=false
          plugin=false
          nativedo=false
          while IFS= read -r path; do
            case "$path" in
              # The full-Telegram subtree and our module: the old :app job does not
              # cover them, so they get their own job (dependency prep + NDK build).
              apps/android/telegram/*|apps/android/nativedo/*) nativedo=true ;;
              apps/android/*) android=true; vendor=true ;;
              # `DiscourseApiClientTest` / `DiscourseMediaUploaderTest` read fixtures/discourse/*,
              # so a fixture edit can fail the unit suite even though it ships no code.
              fixtures/*) android=true; nativedo=true ;;
              # The telegram deps/hook-guard tools and their tests both live in
              # `scripts/`, so their edits run the vendor test discovery *and* the
              # nativedo job (which needs full history to resolve the pin).
              scripts/telegram_*|scripts/telegram-*|scripts/telegramlib.py|scripts/tests/test_telegram_*) vendor=true; nativedo=true ;;
              scripts/*|contracts/*|vendor-overlay.json|VENDOR.md) vendor=true ;;
              .amp/plugins/*) plugin=true ;;
              .github/workflows/*) android=true; vendor=true; plugin=true; nativedo=true ;;
            esac
          done < <(git diff --name-only "$base" HEAD)
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "vendor=$vendor" >> "$GITHUB_OUTPUT"
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "nativedo=$nativedo" >> "$GITHUB_OUTPUT"

  plugin:
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .amp/plugins
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pin the runtime the lockfile was written with; the typecheck gate is
          # only meaningful if the toolchain does not move under it.
          bun-version: "1.3.10"

      - name: Install plugin dev tooling
        # Dev-only: the plugin itself has no runtime dependencies. The lockfile is
        # committed, so this is reproducible and `--frozen-lockfile` fails if a
        # dependency was changed without updating it.
        run: bun install --frozen-lockfile

      - name: Plugin unit tests
        run: bun test jev-router/tests/

      - name: Plugin typecheck
        run: bun run typecheck

  vendor-tooling:
    needs: changes
    if: needs.changes.outputs.vendor == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Blobless sparse clone: materializing the two baselines is one batched
      # fetch each (~100 MB), which keeps the guard at ~0.3s instead of paying
      # a lazy fetch per compared blob.
      - name: Pristine Telegram checkout (blobless, sparse)
        run: |
          PIN="$(python3 -c "import json;print(json.load(open('vendor-overlay.json'))['upstream']['pinned_commit'])")"
          REF="$(python3 -c "import json;print((json.load(open('vendor-overlay.json')).get('reference') or {}).get('commit') or '')")"
          git init -q ../telegram
          git -C ../telegram remote add origin https://github.com/DrKLO/Telegram.git
          git -C ../telegram config extensions.partialClone origin
          git -C ../telegram config remote.origin.promisor true
          git -C ../telegram config remote.origin.partialclonefilter blob:none
          git -C ../telegram sparse-checkout init --cone
          git -C ../telegram sparse-checkout set TMessagesProj/src/main/java
          git -C ../telegram fetch -q --depth=1 --filter=blob:none origin "$PIN"
          if [ -n "$REF" ] && [ "$REF" != "$PIN" ]; then
            git -C ../telegram fetch -q --depth=1 --filter=blob:none origin "$REF"
            git -C ../telegram checkout -q "$REF"
          fi
          git -C ../telegram checkout -q "$PIN"

      # The sparse cone covers the sources; this warms the declared resource
      # blobs too (parallel, ~30 s) so the guard can byte-compare them.
      - name: Prefetch vendor blobs
        run: scripts/vendor-setup.sh --prefetch

      - name: Vendor tooling unit tests
        run: python3 -m unittest discover -s scripts/tests -t scripts/tests

      - name: Vendor guard
        run: scripts/vendor-guard.sh

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;34.0.0 platform-tools"

      # Every run used to re-download the wrapper and the whole dependency graph;
      # on a bad network day that failed with "Could not resolve <artifact>" on a
      # different coordinate each attempt (coil-gif, kotlin-stdlib, the AGP plugin
      # marker, compose-ui, appcompat-resources, com.android.tools:annotations
      # within one afternoon), which is what the retry below and the cache are for:
      # a warm Gradle home turns those into local reads.
      #
      # The key lists the build scripts instead of `apps/android/**/*.gradle*`, which also matches
      # the `.gradle` project directory: its contents are written during the build, so the key
      # computed at save time never equalled the one computed at restore time (measured in run
      # 36511514498: restore asked for ...2665b8c9, the save wrote ...058a062d) - the exact key
      # could never hit, and every run uploaded a fresh multi-hundred-MB entry.
      - uses: actions/cache/restore@v4
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v2-${{ runner.os }}-${{ hashFiles('apps/android/*.gradle.kts', 'apps/android/*/build.gradle.kts', 'apps/android/*/build.gradle', 'apps/android/gradle/**') }}
          restore-keys: |
            gradle-v2-${{ runner.os }}-

      - name: Unit tests and screenshot verification
        # `runUnitAndScreenshotTests` is `:app:verifyPaparazziDebug`: the whole
        # unit suite plus a pixel comparison of every snapshot against the
        # committed goldens. Each host verifies its own set
        # (`src/test/snapshots/<platform>`); this runner is Linux, so it checks
        # the same rendering it can reproduce.
        # Retried once, not more: artifact resolution fails transiently often
        # enough to matter, but a retry is a second full job's worth of minutes
        # on a plan whose quota this repo shares with everything else, so the
        # second attempt reads what the cached Gradle home already has and gives
        # up after that.
        run: |
          for attempt in 1 2; do
            ./apps/android/gradlew -p apps/android runUnitAndScreenshotTests --quiet && exit 0
            status=$?
            echo "attempt $attempt failed (exit $status)"
            if [ "$attempt" = 2 ]; then exit $status; fi
            sleep 15
          done

      # Saved only on success: a failed run leaves Gradle's cache with the missing-artifact markers
      # of whatever it could not download, and restoring that made the next attempt fail on the same
      # coordinate instead of a fresh one (observed on this workflow's first try at caching).
      #
      # Only when the exact key missed. The key is the Gradle build files' hash, so a key hit means
      # this run added nothing the entry does not already have - and re-uploading the whole cache
      # costs ~30 s of runner time per push. A restore-keys hit (the key changed, but an older entry
      # exists) reports `cache-hit: false` and does get saved, which is what keeps the entry current.
      #
      # This only became reachable once the key stopped matching `.gradle` (see the restore step):
      # with that glob every run reported a miss and uploaded again.
      - uses: actions/cache/save@v4
        if: success() && steps.gradle-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v2-${{ runner.os }}-${{ hashFiles('apps/android/*.gradle.kts', 'apps/android/*/build.gradle.kts', 'apps/android/*/build.gradle', 'apps/android/gradle/**') }}

  # The full-Telegram stack: `apps/android/telegram` (a git subtree of upstream
  # kept byte-for-byte) plus our module at `apps/android/nativedo`. This job is
  # separate from `android` because it needs a different toolchain (platform/
  # build-tools 36, NDK 27.2.12479018, CMake 3.22.1), a full-history clone (the
  # subtree pin and its 15 dependency gitlinks live in history), and a source
  # fetch of those pinned dependency trees before Gradle can run.
  nativedo:
    needs: changes
    if: needs.changes.outputs.nativedo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The pin is the `git subtree` merge of apps/android/telegram; its tree
          # carries the 15 dependency gitlinks. A shallow clone cannot resolve
          # either, so both `scripts/telegram-deps.sh` and the hook guard would
          # have nothing to read.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1 platform-tools"

      # Same retry-and-cache reasoning as the `android` job: artifact resolution
      # fails transiently, and a warm Gradle home turns a re-attempt into local
      # reads. The key lists the build scripts explicitly instead of a broad
      # `**/*.gradle*` glob, which would also match the `.gradle` project
      # directory and could never hit (see the android job).
      - uses: actions/cache/restore@v4
        id: nativedo-gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-nativedo-v1-${{ runner.os }}-${{ hashFiles('apps/android/*.gradle.kts', 'apps/android/*/build.gradle.kts', 'apps/android/*/build.gradle', 'apps/android/telegram/gradle/**', 'apps/android/telegram/gradle.properties', 'apps/android/telegram/buildSrc/**/*.gradle.kts') }}
          restore-keys: |
            gradle-nativedo-v1-${{ runner.os }}-

      - name: Materialize pinned Telegram dependency trees
        # Idempotent and pinned to the subtree's gitlinks: fetches each of the 15
        # trees from its own `.gitmodules` remote and extracts it. No prebuilt
        # `.so` is copied from anywhere.
        run: scripts/telegram-deps.sh

      - name: Hook guard (upstream stays pristine)
        # Fails on any non-hook edit under apps/android/telegram, so a render,
        # measurement or gesture change shows up here instead of silently
        # entering the subtree.
        run: scripts/telegram-hook-guard.sh

      - name: Dependency and hook-guard tool tests
        run: python3 -m unittest discover -s scripts/tests -t scripts/tests -p 'test_telegram_*.py'

      - name: Bound build memory
        # Override upstream's 8 GB daemon without editing the subtree. Tests
        # separately bound their heap and recycle native-graphics state per class.
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          EOF

      - name: Unit tests
        run: ./apps/android/telegram/gradlew -p apps/android/telegram :nativedo:testDebugUnitTest --quiet

      - name: arm64 assemble
        run: ./apps/android/telegram/gradlew -p apps/android/telegram :nativedo:assembleDebug -Pandroid.injected.build.abi=arm64-v8a -Pandroid.injected.testOnly=false --quiet

      # On failure keep what a human needs to diagnose it without re-running the
      # ~15 minute job: the JUnit XML, the test report, and the APK/logs if the
      # build got far enough. Retained for a week; a green run uploads nothing.
      - name: Upload verification artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nativedo-verification
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/android/nativedo/build/test-results/**
            apps/android/nativedo/build/reports/tests/**
            apps/android/nativedo/build/outputs/apk/**
            apps/android/nativedo/build/intermediates/apk/**
            apps/android/nativedo/build/outputs/logs/**

      - uses: actions/cache/save@v4
        if: success() && steps.nativedo-gradle-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-nativedo-v1-${{ runner.os }}-${{ hashFiles('apps/android/*.gradle.kts', 'apps/android/*/build.gradle.kts', 'apps/android/*/build.gradle', 'apps/android/telegram/gradle/**', 'apps/android/telegram/gradle.properties', 'apps/android/telegram/buildSrc/**/*.gradle.kts') }}
