name: ci

# Runs only when something that can actually break CI changed: a docs-only or
# fixtures-only commit skips the workflow entirely, and a vendor-tooling commit
# skips the Android job, while a plugin-only commit runs just the plugin job
# (all three are gated by the `changes` job below). The pre-commit hook already
# runs `vendor-guard.sh --quick` on every commit, so CI is the backstop, not the
# first line of defence.
#
# Note: with `paths` filtering plus gated jobs, a skipped job reports "skipped"
# rather than "success". If branch protection ever requires these check names
# on pull requests, either keep the workflow unfiltered or mirror the gates as
# step-level `if:` conditions instead.
on:
  push:
    branches: [main]
    paths: &ci_paths
      - "apps/android/**"
      - "scripts/**"
      - "docs/**"
      - "contracts/**"
      - "vendor-overlay.json"
      - "VENDOR.md"
      - ".amp/plugins/**"
      - ".github/workflows/ci.yml"
  pull_request:
    types: [opened, ready_for_review, synchronize]
    paths: *ci_paths
  workflow_dispatch:

# A newer commit on the same ref makes the older run pointless - with one exception the `changes`
# gate below has to cover: a docs-only commit landing right after a code commit used to cancel the
# only run that would have exercised `apps/android/**`, and the docs run then skipped that job (it
# happened four times in one day). The fix is not to disable cancellation - an expression like
# `${{ github.event_name != 'push' }}` does not do what it looks like, because the interpolated
# `false` is a non-empty string and the runner reads it as true - but to make every push run the
# gates, so the run that survives cancellation is the one that tests the code. Pull requests keep
# the cheap path: their newest push tests the same diff anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      vendor: ${{ steps.filter.outputs.vendor }}
      plugin: ${{ steps.filter.outputs.plugin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE:-}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            # Unknown base (first push, force push, manual run): check everything.
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "vendor=true" >> "$GITHUB_OUTPUT"
            echo "plugin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A push to main always runs every gate: the paths filter above already limits which
          # pushes reach this workflow, and a docs-only commit must not be able to hide a code
          # commit from CI (it cancels that commit's run by landing after it). Pull requests keep
          # the fine-grained gate - their newest push tests the same diff.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "vendor=true" >> "$GITHUB_OUTPUT"
            echo "plugin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          android=false
          vendor=false
          plugin=false
          while IFS= read -r path; do
            case "$path" in
              apps/android/*) android=true; vendor=true ;;
              scripts/*|docs/*|contracts/*|vendor-overlay.json|VENDOR.md) vendor=true ;;
              .amp/plugins/*) plugin=true ;;
              .github/workflows/ci.yml) android=true; vendor=true; plugin=true ;;
            esac
          done < <(git diff --name-only "$base" HEAD)
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "vendor=$vendor" >> "$GITHUB_OUTPUT"
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"

  plugin:
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .amp/plugins
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pin the runtime the lockfile was written with; the typecheck gate is
          # only meaningful if the toolchain does not move under it.
          bun-version: "1.3.10"

      - name: Install plugin dev tooling
        # Dev-only: the plugin itself has no runtime dependencies. The lockfile is
        # committed, so this is reproducible and `--frozen-lockfile` fails if a
        # dependency was changed without updating it.
        run: bun install --frozen-lockfile

      - name: Plugin unit tests
        run: bun test jev-router/tests/

      - name: Plugin typecheck
        run: bun run typecheck

  vendor-tooling:
    needs: changes
    if: needs.changes.outputs.vendor == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Blobless sparse clone: materializing the two baselines is one batched
      # fetch each (~100 MB), which keeps the guard at ~0.3s instead of paying
      # a lazy fetch per compared blob.
      - name: Pristine Telegram checkout (blobless, sparse)
        run: |
          PIN="$(python3 -c "import json;print(json.load(open('vendor-overlay.json'))['upstream']['pinned_commit'])")"
          REF="$(python3 -c "import json;print((json.load(open('vendor-overlay.json')).get('reference') or {}).get('commit') or '')")"
          git init -q ../telegram
          git -C ../telegram remote add origin https://github.com/DrKLO/Telegram.git
          git -C ../telegram config extensions.partialClone origin
          git -C ../telegram config remote.origin.promisor true
          git -C ../telegram config remote.origin.partialclonefilter blob:none
          git -C ../telegram sparse-checkout init --cone
          git -C ../telegram sparse-checkout set TMessagesProj/src/main/java
          git -C ../telegram fetch -q --depth=1 --filter=blob:none origin "$PIN"
          if [ -n "$REF" ] && [ "$REF" != "$PIN" ]; then
            git -C ../telegram fetch -q --depth=1 --filter=blob:none origin "$REF"
            git -C ../telegram checkout -q "$REF"
          fi
          git -C ../telegram checkout -q "$PIN"

      # The sparse cone covers the sources; this warms the declared resource
      # blobs too (parallel, ~30 s) so the guard can byte-compare them.
      - name: Prefetch vendor blobs
        run: scripts/vendor-setup.sh --prefetch

      - name: Vendor tooling unit tests
        run: python3 -m unittest discover -s scripts/tests -t scripts/tests

      - name: Vendor guard
        run: scripts/vendor-guard.sh

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;34.0.0 platform-tools"

      # Every run used to re-download the wrapper and the whole dependency graph;
      # on a bad network day that failed with "Could not resolve <artifact>" on a
      # different coordinate each attempt (coil-gif, kotlin-stdlib, the AGP plugin
      # marker, compose-ui, appcompat-resources, com.android.tools:annotations
      # within one afternoon), which is what the retry below and the cache are for:
      # a warm Gradle home turns those into local reads.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v2-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-v2-${{ runner.os }}-

      - name: Unit tests and screenshot verification
        # `runUnitAndScreenshotTests` is `:app:verifyPaparazziDebug`: the whole
        # unit suite plus a pixel comparison of every snapshot against the
        # committed goldens. Each host verifies its own set
        # (`src/test/snapshots/<platform>`); this runner is Linux, so it checks
        # the same rendering it can reproduce.
        # Retried once, not more: artifact resolution fails transiently often
        # enough to matter, but a retry is a second full job's worth of minutes
        # on a plan whose quota this repo shares with everything else, so the
        # second attempt reads what the cached Gradle home already has and gives
        # up after that.
        run: |
          for attempt in 1 2; do
            ./apps/android/gradlew -p apps/android runUnitAndScreenshotTests --quiet && exit 0
            status=$?
            echo "attempt $attempt failed (exit $status)"
            if [ "$attempt" = 2 ]; then exit $status; fi
            sleep 15
          done

      # Saved only on success: a failed run leaves Gradle's cache with the missing-artifact markers
      # of whatever it could not download, and restoring that made the next attempt fail on the same
      # coordinate instead of a fresh one (observed on this workflow's first try at caching).
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v2-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
