name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  vendor-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Blobless sparse clone: materializing the two baselines is one batched
      # fetch each (~100 MB), which keeps the guard at ~0.3s instead of paying
      # a lazy fetch per compared blob.
      - name: Pristine Telegram checkout (blobless, sparse)
        run: |
          PIN="$(python3 -c "import json;print(json.load(open('vendor-overlay.json'))['upstream']['pinned_commit'])")"
          REF="$(python3 -c "import json;print((json.load(open('vendor-overlay.json')).get('reference') or {}).get('commit') or '')")"
          git init -q ../telegram
          git -C ../telegram remote add origin https://github.com/DrKLO/Telegram.git
          git -C ../telegram config extensions.partialClone origin
          git -C ../telegram config remote.origin.promisor true
          git -C ../telegram config remote.origin.partialclonefilter blob:none
          git -C ../telegram sparse-checkout init --cone
          git -C ../telegram sparse-checkout set TMessagesProj/src/main/java
          git -C ../telegram fetch -q --depth=1 --filter=blob:none origin "$PIN"
          if [ -n "$REF" ] && [ "$REF" != "$PIN" ]; then
            git -C ../telegram fetch -q --depth=1 --filter=blob:none origin "$REF"
            git -C ../telegram checkout -q "$REF"
          fi
          git -C ../telegram checkout -q "$PIN"

      # The sparse cone covers the sources; this warms the declared resource
      # blobs too (parallel, ~30 s) so the guard can byte-compare them.
      - name: Prefetch vendor blobs
        run: scripts/vendor-setup.sh --prefetch

      - name: Vendor tooling unit tests
        run: python3 -m unittest discover -s scripts/tests -t scripts/tests

      - name: Vendor guard
        run: scripts/vendor-guard.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;34.0.0 platform-tools"

      - name: Unit tests
        run: ./apps/android/gradlew -p apps/android :app:testDebugUnitTest --quiet
