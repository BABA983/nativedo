// NativeDo: our app module. It sits outside the upstream subtree (apps/android/telegram) and is
// the only place our own code lives, so an upstream subtree pull can never conflict with it.
//
// The upstream build has no Kotlin or serialization plugin on its classpath, so this module brings
// its own; that keeps the upstream build files free of our additions.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'org.jetbrains.kotlin:kotlin-serialization:2.1.0'
    }
}

apply plugin: 'com.android.application'
// Upstream's app-side build plugin. It takes the strings of :TMessagesProj and this module and
// produces what upstream's UI reads at runtime: the localization assets (without them every label
// is "LOC_ERR:<key>"), the string resource id table, and the lottie metadata.
apply plugin: 'org.telegram.build-app-plugin'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

// --- Shared signing key ------------------------------------------------------
// Every builder (Mac, another PC, orb, CI) has to sign with the same key: a package signed by
// another machine's key cannot replace an install in place, and the installer reports
// `INSTALL_FAILED_UPDATE_INCOMPATIBLE` (-7). Gradle's default debug key is generated per machine,
// so the shared key is supplied from outside the repository and never committed:
//
//   apps/android/nativedo/keystore.properties         (gitignored)
//     storeFile=/path/to/nativedo.jks    # absolute, or relative to this module
//     storePassword=...
//     keyAlias=...
//     keyPassword=...                    # optional; defaults to storePassword
//
// or the same four values as `NATIVEDO_KEYSTORE_FILE`, `NATIVEDO_KEYSTORE_PASSWORD`,
// `NATIVEDO_KEY_ALIAS` and `NATIVEDO_KEY_PASSWORD`. Without either, debug and preview fall back to
// the per-machine debug key, which is what the warning below says out loud.
def sharedSigningProps = new Properties()
def sharedSigningPropsFile = file('keystore.properties')
def sharedSigningSource = null
if (sharedSigningPropsFile.exists()) {
    sharedSigningPropsFile.withInputStream { sharedSigningProps.load(it) }
    sharedSigningSource = sharedSigningPropsFile.path
} else if (System.getenv('NATIVEDO_KEYSTORE_FILE')) {
    sharedSigningProps.setProperty('storeFile', System.getenv('NATIVEDO_KEYSTORE_FILE'))
    sharedSigningProps.setProperty('storePassword', System.getenv('NATIVEDO_KEYSTORE_PASSWORD') ?: '')
    sharedSigningProps.setProperty('keyAlias', System.getenv('NATIVEDO_KEY_ALIAS') ?: '')
    sharedSigningProps.setProperty('keyPassword', System.getenv('NATIVEDO_KEY_PASSWORD') ?: '')
    sharedSigningSource = 'NATIVEDO_KEYSTORE_FILE'
}
def sharedSigningFile = sharedSigningSource == null ? null : file(sharedSigningProps.getProperty('storeFile'))
def sharedSigningAlias = sharedSigningProps.getProperty('keyAlias')
def sharedSigningStorePassword = sharedSigningProps.getProperty('storePassword')
def sharedSigningKeyPassword = sharedSigningProps.getProperty('keyPassword') ?: sharedSigningStorePassword

if (sharedSigningFile == null) {
    logger.warn('nativedo: no shared signing key configured (keystore.properties or NATIVEDO_* ' +
        'environment): debug builds fall back to the per-machine debug key and release builds stay ' +
        'unsigned, so either APK fails to replace an install made on another machine - ' +
        'INSTALL_FAILED_UPDATE_INCOMPATIBLE (-7).')
}

// Build identity for the variants that are handed out by hand: the commit the APK came from, so
// two sideloaded builds can be told apart on the device. A source export without Git falls back to
// no suffix instead of failing the build.
def gitSha = {
    try {
        def process = new ProcessBuilder('git', 'rev-parse', '--short', 'HEAD')
            .directory(rootDir)
            .redirectErrorStream(true)
            .start()
        def text = process.inputStream.text.trim()
        return process.waitFor() == 0 && text ? text : null
    } catch (Exception ignored) {
        return null
    }
}()

android {
    namespace 'io.github.baba983.nativedo'
    compileSdkVersion 36
    buildToolsVersion '36.0.0'
    // Stripping the native library needs an NDK; without this AGP has no strip binary and ships
    // the 351 MB unstripped libtmessages.49.so.
    ndkVersion '27.2.12479018'

    signingConfigs {
        if (sharedSigningFile != null) {
            shared {
                storeFile sharedSigningFile
                storePassword sharedSigningStorePassword
                keyAlias sharedSigningAlias
                keyPassword sharedSigningKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId 'io.github.baba983.nativedo'
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName '0.1.0'
    }

    buildFeatures {
        buildConfig true
    }

    androidResources {
        // Upstream's app module ships the same resources: "pack" must stay uncompressed (emoji
        // packs are read in place), and the locale filter drops the translations from the resource
        // table because Telegram delivers them as assets instead. Without the filter this app
        // carried ~5 MB of resource-table strings it never reads.
        noCompress += 'pack'
        localeFilters += ['zz']
    }

    packaging {
        // Upstream's own app module stores its native libraries deflated, and this client is
        // distributed as an APK rather than through a store that re-compresses it: a ~25 MB
        // smaller download is worth the unpacking Android does once at install.
        jniLibs { useLegacyPackaging = true }
    }

    lint {
        // Upstream's app module sets the same. `lintVitalRelease` cannot load `:TMessagesProj`'s
        // class hierarchy and reports the manifest's `LaunchActivity` as not an Activity; run
        // `:nativedo:lint` deliberately instead of gating the release build on that false positive.
        checkReleaseBuilds false
    }

    // Channels are a flavor dimension; build types say only how a variant is produced. `daily` is
    // the package the app is used from, `preview` the side-by-side trial build (own package, own
    // login and storage, own label from `src/preview/AndroidManifest.xml`).
    flavorDimensions += 'channel'

    productFlavors {
        daily {
            dimension 'channel'
        }
        preview {
            dimension 'channel'
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
        }
    }

    buildTypes {
        debug {
            if (sharedSigningFile != null) {
                signingConfig signingConfigs.shared
            }
            // Upstream's own app build sets these; without debugSymbolLevel AGP leaves the 351 MB
            // unstripped libtmessages.49.so in the APK instead of moving the symbols out.
            jniDebuggable true
            ndk.debugSymbolLevel = 'FULL'
            // Which commit is on the phone: hand-installed builds are compared by hand.
            versionNameSuffix gitSha ? "-debug-${gitSha}" : '-debug'
        }
        release {
            // The same key as debug on purpose: the signature is what lets the daily package move
            // between a debug and a release APK in place. Without a key the APK is unsigned and
            // cannot be installed at all.
            if (sharedSigningFile != null) {
                signingConfig signingConfigs.shared
            }
            // R8 stays off: this module compiles the vendored Telegram tree, whose reflection (JNI
            // callbacks, tgnet) needs keep rules and a device pass before shrinking is safe.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Robolectric native graphics also allocates outside the Java heap. Recycle
                // the JVM between classes so a full run does not accumulate that native state.
                maxHeapSize = '3g'
                maxParallelForks = 1
                forkEvery = 1
                testLogging {
                    showStandardStreams = true
                    events 'passed', 'failed', 'skipped'
                    exceptionFormat 'full'
                }
            }
        }
    }
}

dependencies {
    implementation project(':TMessagesProj')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // :TMessagesProj declares these as `implementation`, so its own classpath does not leak into
    // ours even though upstream's public API (RecyclerListView, MessageObject) exposes their types.
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.collection:collection:1.4.5'
    // The swipe-to-reply port from ChatActivity animates with upstream's springs of this library.
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:1.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jsoup:jsoup:1.18.1'
    // The voice editor crops/joins a recorded `.m4a` by its container sample table. :TMessagesProj
    // declares isoparser as `implementation`, so it does not leak onto this module's classpath.
    implementation 'com.googlecode.mp4parser:isoparser:1.0.6'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.15.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.core:core:1.16.0'
    testImplementation 'androidx.collection:collection:1.4.5'
    // The screen tests serve fixtures/discourse/* over a local server, so the whole chain
    // (retrofit client -> models -> stock cells) runs for real instead of being stubbed.
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
}
